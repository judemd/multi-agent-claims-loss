[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claimcascade"
version = "0.1.0"
description = "Evidence-led shared loss event investigation POC"
requires-python = ">=3.11,<3.15"
dependencies = [
  "google-adk>=1.20,<3", "streamlit>=1.50,<2", "plotly>=6,<8",
  "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["claimcascade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
